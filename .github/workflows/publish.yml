name: Publish Package

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag is annotated
        run: |
          if ! git cat-file -t "${{ github.ref_name }}" | grep -q "^tag$"; then
            echo "This is not an annotated tag, aborting."
            exit 1
          fi

      - name: Get tag annotation
        id: get_annotation
        run: |
          {
            echo 'ANNOTATION<<EOF'
            git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.get_annotation.outputs.ANNOTATION }}
